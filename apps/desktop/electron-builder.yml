appId: com.meroxis.qasaerp
productName: Qasa ERP
copyright: © 2026 Meroxis
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - package.json
asar: true
compression: maximum
electronLanguages: [en-US, ar]
# Hardening: the app can't be used as a plain Node runtime, and it refuses tampered app files.
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  loadBrowserProcessSpecificV8Snapshot: false
  grantFileProtocolExtraPrivileges: false
npmRebuild: false
win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.png
  artifactName: Qasa-ERP-Setup-${version}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Qasa ERP
  uninstallDisplayName: Qasa ERP
  multiLanguageInstaller: true
  installerLanguages: [en_US, ar_SA]
  license: ../../LICENSE
  deleteAppDataOnUninstall: false
publish:
  provider: github
  owner: meroxis
  repo: qasa-erp
  releaseType: release
# The Microsoft Store package (npm run dist:store): Microsoft signs it when the Store accepts it. The identity is the one
# Partner Center gave "Qasa ERP" (Store ID 9NRTX5BBK9DW, https://apps.microsoft.com/detail/9NRTX5BBK9DW).
# build/appxmanifest.xml keeps the company data in %APPDATA%\Qasa ERP (not virtualized), so uninstalling never deletes
# the books; build/appx has the tiles. That setting (desktop6:FileSystemWriteVirtualization) needs Windows 10 1903
# (build 18362): on an older Windows the books would go to the package's private folder and leave with it.
appx:
  identityName: meroxis.QasaERP
  publisher: CN=6A390DDD-1980-41EB-A7B5-643F47981235
  publisherDisplayName: meroxis
  applicationId: QasaERP
  displayName: Qasa ERP
  backgroundColor: "#0F1E3D"
  showNameOnTiles: true
  languages: [en-US, ar, ku-Arab]
  minVersion: 10.0.18362.0
  maxVersionTested: 10.0.26100.0
  customManifestPath: appxmanifest.xml
  artifactName: Qasa-ERP-Store-${version}.${ext}
