name: Tests

on:
  push:
    branches: [main]
  pull_request:

# the tests only read the repository
permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    name: Node 24

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:demo -w @qasa/web

  # The compiled licence checks as a Windows PC gets them: built the way the release builds them, which stops when the
  # addon still asks Windows for the Visual C++ runtime (a new PC has none, and the app then checks no licence and no
  # free month: native/licence/.cargo/config.toml), then loaded by Node.
  licence-windows:
    runs-on: windows-latest
    name: Licence addon on Windows

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Build
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          node native/licence/build.mjs

      - name: Load
        shell: bash
        run: node -e "const m = require('./native/licence/dist/qasa_licence.node'); if (!m.publicKeys().length || typeof m.machineId('x') !== 'string') process.exit(1); console.log('loaded, keys:', m.publicKeys().length)"

  # The phone app (apps/mobile) is not in the workspace above: its own packages, its type check and its tests (the
  # protocol client, the outbox, the PIN rule). Nothing is built for a phone here.
  phone:
    runs-on: ubuntu-latest
    name: Phone app
    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      # exactly as locked, with no install scripts: none is needed to type-check and test the app's code
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
