name: Release

# Push a tag like v0.1.1 (matching apps/desktop/package.json "version"; notes in apps/desktop/release-notes/0.1.1.md)
# to build the Windows installer on a clean machine and publish it as a GitHub release: copies installed with the
# installer find it and update themselves. The run also keeps the Microsoft Store package (artifact
# microsoft-store-package): submit it in Partner Center with the "What's new" text from apps/desktop/store-listing.json;
# Store copies update once Microsoft certifies it. Store copies can be a release behind, and 0.1.8 there doesn't refuse
# newer books: get a release with the database_newer check into the Store before publishing one that adds a migration.
#
# A tag like v0.2.0-beta.1 (version 0.2.0-beta.1) is a beta: a GitHub prerelease that only copies on the beta channel
# (Settings → Updates → Join the beta) install. Betas get no Microsoft Store package and don't move the stable download
# link. See docs/releasing.md.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    name: Windows installer

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Official builds include the Pro module from the private repository (read-only deploy key).
      - name: Pro module
        uses: actions/checkout@v5
        with:
          repository: meroxis/qasa-erp-pro
          ssh-key: ${{ secrets.PRO_DEPLOY_KEY }}
          path: pro
          persist-credentials: false

      # its own dependencies (the MariaDB/MySQL driver), exactly as locked, with no install scripts
      - name: Pro module dependencies
        shell: bash
        run: |
          npm ci --prefix pro --ignore-scripts
          npm audit --prefix pro --omit=dev --audit-level=high

      - name: Electron binary
        run: node node_modules/electron/install.js

      # The compiled licence checks (native/licence, Rust): the runner has rustup with the MSVC toolchain.
      - name: Licence addon (Rust)
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          node native/licence/build.mjs
          test -f native/licence/dist/qasa_licence.node

      - name: Tag matches the app version
        shell: bash
        run: |
          version=$(node -p "require('./apps/desktop/package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match apps/desktop/package.json version $version"; exit 1
          fi

      # vX.Y.Z is stable; vX.Y.Z-beta.N is a beta. Anything else (alpha, rc, beta without a number) is refused.
      - name: Stable or beta
        id: kind
        shell: bash
        run: |
          if [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "beta=false" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$ ]]; then
            echo "beta=true" >> "$GITHUB_OUTPUT"
          else
            echo "Tag $GITHUB_REF_NAME must be vX.Y.Z or vX.Y.Z-beta.N"; exit 1
          fi

      - run: npm run typecheck
      - run: npm test

      # Create the release first (as a draft): electron-builder then uploads into it instead of racing to create it.
      - name: Create the release draft
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BETA: ${{ steps.kind.outputs.beta }}
        run: |
          version=$(node -p "require('./apps/desktop/package.json').version")
          notes="apps/desktop/release-notes/$version.md"
          title="Qasa ERP $version"
          extra=()
          if [ "$BETA" = "true" ]; then title="Qasa ERP $version (beta)"; extra=(--prerelease); fi
          if [ -f "$notes" ]; then
            gh release create "$GITHUB_REF_NAME" --draft "${extra[@]}" --title "$title" --notes-file "$notes"
          else
            gh release create "$GITHUB_REF_NAME" --draft "${extra[@]}" --title "$title" --generate-notes
          fi

      - name: Build and publish the installer
        shell: bash
        run: |
          if [ "$BETA" = "true" ]; then
            npm run release -w @qasa/desktop -- -c.publish.releaseType=prerelease
          else
            npm run release -w @qasa/desktop
          fi
        env:
          BETA: ${{ steps.kind.outputs.beta }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # signs app.asar's hash for the licence addon's integrity check (after-pack.cjs; native/licence/README.md)
          QASA_INTEGRITY_KEY: ${{ secrets.QASA_INTEGRITY_KEY }}
          # Pro cloud backup (Google Drive, OneDrive): see pro/docs/cloud-backup-setup.md
          QASA_GOOGLE_CLIENT_ID: ${{ secrets.QASA_GOOGLE_CLIENT_ID }}
          QASA_GOOGLE_CLIENT_SECRET: ${{ secrets.QASA_GOOGLE_CLIENT_SECRET }}
          QASA_MS_CLIENT_ID: ${{ secrets.QASA_MS_CLIENT_ID }}

      # The Microsoft Store package from the same build (not signed: the Store signs it when it accepts it). It is kept
      # with the run for upload to Partner Center, not attached to the release (Windows won't install it unsigned).
      # (stable releases only: the Store has no beta channel here)
      - name: Microsoft Store package
        if: steps.kind.outputs.beta != 'true'
        run: node apps/desktop/store.mjs
        env:
          QASA_INTEGRITY_KEY: ${{ secrets.QASA_INTEGRITY_KEY }}

      - uses: actions/upload-artifact@v7
        if: steps.kind.outputs.beta != 'true'
        with:
          name: microsoft-store-package
          path: apps/desktop/release/Qasa-ERP-Store-*.appx
          if-no-files-found: error
          retention-days: 90

      - name: Stable download link and update block map
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BETA: ${{ steps.kind.outputs.beta }}
        run: |
          version=$(node -p "require('./apps/desktop/package.json').version")
          if [ "$BETA" != "true" ]; then
            cp "apps/desktop/release/Qasa-ERP-Setup-$version.exe" Qasa-ERP-Setup.exe
            # releases/latest/download/Qasa-ERP-Setup.exe always points at the newest stable installer (the website links to it)
            gh release upload "$GITHUB_REF_NAME" Qasa-ERP-Setup.exe --clobber
          fi
          # the block map lets the next update download only the parts that changed
          gh release upload "$GITHUB_REF_NAME" "apps/desktop/release/Qasa-ERP-Setup-$version.exe.blockmap" --clobber

      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BETA: ${{ steps.kind.outputs.beta }}
        run: |
          if [ "$BETA" = "true" ]; then
            # a prerelease never becomes "latest": the website link and stable copies stay on the last stable
            gh release edit "$GITHUB_REF_NAME" --draft=false --prerelease --latest=false
          else
            gh release edit "$GITHUB_REF_NAME" --draft=false --latest
          fi
