name: Release

# Push a tag like v0.1.1 (matching apps/desktop/package.json "version"; notes in apps/desktop/release-notes/0.1.1.md)
# to build the Windows installer on a clean machine and publish it as a GitHub release: copies installed with the
# installer find it and update themselves. The run also keeps the Microsoft Store package (artifact
# microsoft-store-package): submit it in Partner Center with the "What's new" text from apps/desktop/store-listing.json;
# Store copies update once Microsoft certifies it. Store copies can be a release behind, and 0.1.8 there doesn't refuse
# newer books: get a release with the database_newer check into the Store before publishing one that adds a migration.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    name: Windows installer

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Official builds include the Pro module from the private repository (read-only deploy key).
      - name: Pro module
        uses: actions/checkout@v5
        with:
          repository: meroxis/qasa-erp-pro
          ssh-key: ${{ secrets.PRO_DEPLOY_KEY }}
          path: pro
          persist-credentials: false

      # its own dependencies (the MariaDB/MySQL driver), exactly as locked, with no install scripts
      - name: Pro module dependencies
        shell: bash
        run: |
          npm ci --prefix pro --ignore-scripts
          npm audit --prefix pro --omit=dev --audit-level=high

      - name: Electron binary
        run: node node_modules/electron/install.js

      - name: Tag matches the app version
        shell: bash
        run: |
          version=$(node -p "require('./apps/desktop/package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match apps/desktop/package.json version $version"; exit 1
          fi

      - run: npm run typecheck
      - run: npm test

      # Create the release first (as a draft): electron-builder then uploads into it instead of racing to create it.
      - name: Create the release draft
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(node -p "require('./apps/desktop/package.json').version")
          notes="apps/desktop/release-notes/$version.md"
          if [ -f "$notes" ]; then
            gh release create "$GITHUB_REF_NAME" --draft --title "Qasa ERP $version" --notes-file "$notes"
          else
            gh release create "$GITHUB_REF_NAME" --draft --title "Qasa ERP $version" --generate-notes
          fi

      - name: Build and publish the installer
        run: npm run release -w @qasa/desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The Microsoft Store package from the same build (not signed: the Store signs it when it accepts it). It is kept
      # with the run for upload to Partner Center, not attached to the release (Windows won't install it unsigned).
      - name: Microsoft Store package
        run: node apps/desktop/store.mjs

      - uses: actions/upload-artifact@v7
        with:
          name: microsoft-store-package
          path: apps/desktop/release/Qasa-ERP-Store-*.appx
          if-no-files-found: error
          retention-days: 90

      - name: Stable download link and update block map
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(node -p "require('./apps/desktop/package.json').version")
          cp "apps/desktop/release/Qasa-ERP-Setup-$version.exe" Qasa-ERP-Setup.exe
          # releases/latest/download/Qasa-ERP-Setup.exe always points at the newest installer (the website links to it)
          gh release upload "$GITHUB_REF_NAME" Qasa-ERP-Setup.exe --clobber
          # the block map lets the next update download only the parts that changed
          gh release upload "$GITHUB_REF_NAME" "apps/desktop/release/Qasa-ERP-Setup-$version.exe.blockmap" --clobber

      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --latest
